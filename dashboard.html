<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level Design Dashboard</title>
  <style>
    /* ── Design tokens ───────────────────────────────────────────────────────── */
    :root {
      --bg:         #0b0e14;
      --panel:      #0f1219;
      --panel-alt:  #0d1018;
      --surface:    #141820;
      --border:     #374151;
      --border-dim: #1f2937;
      --focus-ring: #38bdf8;
      --text:       #9ca3af;
      --text-hi:    #e5e7eb;
      --text-dim:   #6b7280;
      --accent:     #38bdf8;
      --green:      #34d399;
      --amber:      #fbbf24;
      --purple:     #a78bfa;
      --red:        #f87171;
      --font:       Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-mono:  'Cascadia Code', 'Fira Code', 'Courier New', monospace;
    }

    /* ── Reset ───────────────────────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 3px; }
    ::-webkit-scrollbar       { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    button { font-family: var(--font); }

    /* ── App shell ───────────────────────────────────────────────────────────── */
    #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    #app-header {
      flex-shrink: 0; height: 42px;
      display: flex; align-items: center; gap: 12px; padding: 0 16px;
      background: var(--panel-alt); border-bottom: 1px solid var(--border);
    }
    .hdr-logo {
      font-family: var(--font-mono); font-weight: 700; font-size: 11px;
      letter-spacing: 3px; color: var(--accent); text-transform: uppercase;
    }
    .hdr-sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
    #map-status { font-size: 12px; color: var(--text-dim); }
    #hdr-nav { margin-left: auto; display: flex; gap: 8px; }
    .hdr-nav-link {
      font-size: 12px; color: var(--text-dim); text-decoration: none; padding: 3px 8px;
      border-radius: 4px; border: 1px solid transparent; transition: all 0.1s;
    }
    .hdr-nav-link:hover { color: var(--text-hi); border-color: var(--border); background: var(--surface); }

    /* ── CSS Grid dashboard ──────────────────────────────────────────────────── */
    #dashboard {
      display: grid;
      grid-template-columns: 1fr 300px;
      grid-template-rows: 1fr minmax(350px, 35vh);
      flex: 1;
      overflow: hidden;
    }

    /* ── Area 1: Map Viewport (col 1, row 1) ─────────────────────────────────── */
    #map-viewport {
      grid-column: 1;
      grid-row: 1;
      background: #07090f;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }

    #viewport-toolbar {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 6px 12px;
      background: var(--panel-alt); border-bottom: 1px solid var(--border);
    }
    .vp-lbl {
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--text-dim); white-space: nowrap;
    }
    #canvas-zoom {
      background: var(--surface); color: var(--text-hi);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 3px 6px; font-size: 12px; cursor: pointer; outline: none;
    }
    #canvas-zoom:focus-visible { outline: 2px solid var(--focus-ring); }

    #layer-toggle { display: flex; gap: 3px; }
    .layer-btn {
      padding: 3px 9px; border-radius: 3px; cursor: pointer;
      font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
      transition: all 0.1s;
    }
    .layer-btn.active { background: rgba(56,189,248,0.12); color: var(--accent); border-color: rgba(56,189,248,0.4); }
    .layer-btn:hover:not(.active) { color: var(--text); border-color: #4b5563; }

    #brush-display {
      margin-left: auto; display: flex; align-items: center; gap: 8px;
    }
    #brush-swatch {
      width: 40px; height: 20px; border-radius: 2px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      image-rendering: pixelated;
    }
    #brush-swatch img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    #brush-label { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }

    #eraser-btn {
      padding: 3px 9px; border-radius: 3px; cursor: pointer;
      font-size: 11px; font-weight: 600;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
      transition: all 0.1s;
    }
    #eraser-btn.active {
      background: rgba(248,113,113,0.1); color: var(--red); border-color: rgba(248,113,113,0.4);
    }
    #eraser-btn:hover:not(.active) { color: var(--red); border-color: rgba(248,113,113,0.4); }

    #btn-erase-all {
      padding: 3px 9px; border-radius: 3px; cursor: pointer;
      font-size: 11px; font-weight: 600;
      border: 1px solid rgba(248,113,113,0.35);
      background: rgba(248,113,113,0.08); color: var(--red);
      transition: all 0.1s;
    }
    #btn-erase-all:hover {
      background: rgba(248,113,113,0.18); border-color: var(--red);
    }
    #btn-erase-all:active { filter: brightness(1.2); }

    #btn-export, #btn-sync {
      padding: 3px 9px; border-radius: 3px; cursor: pointer;
      font-size: 11px; font-weight: 600;
      border: 1px solid rgba(52,211,153,0.35);
      background: rgba(52,211,153,0.08); color: var(--green);
      transition: all 0.1s;
    }
    #btn-export:hover, #btn-sync:hover {
      background: rgba(52,211,153,0.16); border-color: var(--green);
    }
    #btn-export:active, #btn-sync:active { filter: brightness(1.2); }
    #btn-sync.synced {
      border-color: rgba(56,189,248,0.5);
      background: rgba(56,189,248,0.12); color: var(--accent);
    }
    #btn-sync.error {
      border-color: rgba(248,113,113,0.5);
      background: rgba(248,113,113,0.12); color: var(--red);
    }

    #canvas-wrap {
      flex: 1; overflow: hidden;
      position: relative;
    }
    #map-canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: crosshair;
    }

    /* ── Area 3: Tile Inspector (col 2, row 1) ───────────────────────────────── */
    #tile-inspector {
      grid-column: 2;
      grid-row: 1;
      background: var(--panel);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .panel-hdr {
      flex-shrink: 0; padding: 7px 12px;
      background: var(--panel-alt); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--font-mono); font-size: 10px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim);
    }
    .panel-hdr-right { font-size: 11px; color: var(--accent); letter-spacing: 0; font-weight: 600; }

    #inspector-scroll { flex: 1; overflow-y: auto; padding: 10px 10px 16px; }
    #inspector-empty {
      font-size: 12px; color: var(--text-dim); font-style: italic; padding: 2px 0;
    }

    .insp-layer {
      margin-bottom: 8px; border-radius: 6px; overflow: hidden;
      border: 1px solid var(--border-dim);
    }
    .insp-layer-hdr {
      display: flex; align-items: center; gap: 7px; padding: 5px 9px;
      background: var(--surface); border-bottom: 1px solid var(--border-dim);
      cursor: pointer; user-select: none;
    }
    .insp-layer-hdr:hover { background: #191f2b; }
    .insp-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .layer-floor     .insp-dot { background: var(--green); }
    .layer-prop      .insp-dot { background: var(--amber); }
    .layer-overhead  .insp-dot { background: var(--purple); }
    .insp-layer-name {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--text-dim); flex: 1;
    }
    .insp-clear-btn {
      background: none; border: none; cursor: pointer; padding: 0 3px;
      color: var(--text-dim); font-size: 16px; line-height: 1;
      transition: color 0.1s; display: none;
    }
    .insp-clear-btn:hover { color: var(--red); }
    .insp-layer-body { padding: 8px 9px; display: flex; align-items: center; gap: 9px; }
    .insp-thumb {
      width: 40px; height: 20px; flex-shrink: 0;
      background: #0a0d14; border: 1px solid var(--border-dim); border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      image-rendering: pixelated; overflow: hidden;
    }
    .insp-thumb img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
    .insp-folder-id { font-family: var(--font-mono); font-size: 11px; color: var(--text); }
    .insp-empty-lbl  { font-size: 11px; color: var(--text-dim); font-style: italic; }
    .insp-set-brush {
      margin-left: auto; padding: 2px 7px; border-radius: 3px; cursor: pointer;
      font-size: 10px; font-weight: 600; border: 1px solid rgba(56,189,248,0.3);
      background: rgba(56,189,248,0.08); color: var(--accent);
      transition: all 0.1s; display: none;
    }
    .insp-set-brush:hover { background: rgba(56,189,248,0.15); border-color: var(--accent); }

    /* ── Area 2: Asset Browser (col 1-2, row 2) ──────────────────────────────── */
    #asset-browser {
      grid-column: 1 / 3;
      grid-row: 2;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 300px 1fr;
      overflow: hidden;
    }

    /* ── Left: Folder Rail ────────────────────────────────────────────────── */
    #folder-rail {
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
      background: var(--panel);
    }

    #rail-search-row {
      flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      background: var(--panel-alt); border-bottom: 1px solid var(--border);
    }
    #folder-search {
      flex: 1; min-height: 26px; padding: 0 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
      color: var(--text-hi); font-family: var(--font); font-size: 12px; outline: none;
      transition: border-color 0.1s;
    }
    #folder-search:focus { border-color: var(--focus-ring); }
    #folder-search::placeholder { color: var(--text-dim); }
    #tag-dropdown {
      flex-shrink: 0; height: 26px; padding: 0 4px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
      color: var(--text-hi); font-family: var(--font); font-size: 11px;
      cursor: pointer; outline: none; max-width: 118px;
    }
    #tag-dropdown:focus { border-color: var(--focus-ring); }
    #folder-count {
      font-size: 10px; color: var(--text-dim); white-space: nowrap; flex-shrink: 0;
    }

    #folder-list { flex: 1; overflow-y: auto; }
    .folder-rail-sentinel { height: 1px; }

    .folder-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 10px; cursor: pointer;
      border-bottom: 1px solid var(--border-dim);
      transition: background 0.1s; min-height: 44px;
    }
    .folder-item:hover   { background: var(--surface); }
    .folder-item.active  {
      background: rgba(56,189,248,0.07);
      border-left: 2px solid var(--accent); padding-left: 8px;
    }
    .folder-item-thumb {
      width: 32px; height: 16px; flex-shrink: 0;
      background: #0a0d14; border: 1px solid var(--border-dim); border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      image-rendering: pixelated; overflow: hidden;
    }
    .folder-item-thumb img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
    .folder-item-info  { flex: 1; min-width: 0; }
    .folder-item-id {
      font-family: var(--font-mono); font-size: 10px; color: var(--text-hi);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .folder-item.active .folder-item-id { color: var(--accent); }
    .folder-item-count { font-size: 9px; color: var(--text-dim); margin-top: 1px; }
    .folder-item-tags  { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 3px; }
    .folder-tag-pill {
      font-size: 8px; padding: 0 4px; border-radius: 99px;
      background: rgba(167,139,250,0.1); color: var(--purple);
      border: 1px solid rgba(167,139,250,0.25);
    }

    /* ── Right: Sprite Content ────────────────────────────────────────────── */
    #sprite-content {
      overflow-y: auto; overflow-x: hidden;
      background: var(--panel-alt);
      display: flex; flex-direction: column;
    }
    .sprite-content-hdr {
      flex-shrink: 0; padding: 5px 12px;
      background: var(--panel); border-bottom: 1px solid var(--border);
      font-family: var(--font-mono); font-size: 10px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim);
      position: sticky; top: 0; z-index: 1;
    }
    .sprite-grid {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 8px 10px; align-content: flex-start;
    }
    .sprite-card {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 5px 6px; border-radius: 5px; cursor: pointer;
      border: 2px solid transparent; background: var(--surface);
      transition: border-color 0.1s, background 0.1s;
      width: 96px;
    }
    .sprite-card:hover  { background: rgba(55,65,81,0.35); border-color: var(--border); }
    .sprite-card.active    { border-color: var(--accent); background: rgba(56,189,248,0.08); }
    .sprite-card.selected  { border-color: var(--accent); background: rgba(56,189,248,0.08); }
    .sprite-card-img {
      width: 80px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: #0a0d14; border-radius: 1px; overflow: hidden;
    }
    /* CRITICAL: explicit 2× dimensions + pixelated keeps pixel art razor-sharp */
    .sprite-card-img img {
      width: 80px; height: 40px;
      object-fit: contain; image-rendering: pixelated;
    }
    .sprite-placeholder {
      width: 8px; height: 8px; border-radius: 50%; background: var(--border-dim);
    }
    .sprite-card-name {
      font-family: var(--font-mono); font-size: 7px; color: var(--text-dim);
      width: 100%; text-align: center; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── Mini tag bar (sprite-level) ──────────────────────────────────────── */
    .mini-tag-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
      width: 100%; justify-content: center;
    }
    .mini-tag-pill {
      display: inline-flex; align-items: center; gap: 2px;
      font-size: 7px; padding: 0 3px; border-radius: 99px;
      background: rgba(167,139,250,0.12); color: var(--purple);
      border: 1px solid rgba(167,139,250,0.3);
    }
    .mini-tag-rm {
      background: none; border: none; cursor: pointer;
      color: var(--purple); font-size: 9px; line-height: 1; padding: 0; opacity: 0.6;
    }
    .mini-tag-rm:hover { opacity: 1; }
    .mini-tag-add {
      background: none; border: 1px solid var(--border-dim); border-radius: 99px;
      cursor: pointer; color: var(--text-dim); font-size: 8px;
      padding: 0 3px; line-height: 1.4; transition: all 0.1s;
    }
    .mini-tag-add:hover { color: var(--accent); border-color: rgba(56,189,248,0.4); }
    .mini-tag-input {
      width: 48px; font-size: 8px; padding: 0 4px;
      background: var(--surface); border: 1px solid var(--focus-ring);
      border-radius: 3px; color: var(--text-hi); outline: none;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Header ──────────────────────────────────────────────────────────────── -->
  <header id="app-header">
    <span class="hdr-logo">Level Design</span>
    <div class="hdr-sep"></div>
    <span id="map-status">Loading assets…</span>
    <nav id="hdr-nav">
      <a class="hdr-nav-link" href="/lab">Asset Lab</a>
      <a class="hdr-nav-link" href="/">Game</a>
    </nav>
  </header>

  <!-- ── CSS Grid: 2 columns × 2 rows ─────────────────────────────────────────── -->
  <div id="dashboard">

    <!-- ── Area 1: Map Viewport (col 1 / row 1) ────────────────────────────── -->
    <div id="map-viewport" aria-label="Map viewport">

      <div id="viewport-toolbar">

        <span class="vp-lbl">Zoom</span>
        <select id="canvas-zoom" aria-label="Canvas zoom level">
          <option value="1">1×</option>
          <option value="2" selected>2×</option>
          <option value="4">4×</option>
        </select>

        <div class="hdr-sep"></div>

        <span class="vp-lbl">Layer</span>
        <div id="layer-toggle" role="group" aria-label="Active paint layer">
          <button class="layer-btn active" data-layer="floor"    aria-pressed="true" >Floor</button>
          <button class="layer-btn"        data-layer="prop"     aria-pressed="false">Prop</button>
          <button class="layer-btn"        data-layer="overhead" aria-pressed="false">Overhead</button>
        </div>

        <button id="eraser-btn" aria-pressed="false">⌫ Erase</button>
        <button id="btn-erase-all" title="Erase entire map (Ctrl+Z to undo)">⚠ Erase All</button>

        <div class="hdr-sep"></div>

        <button id="btn-export" title="Download map as JSON">⬇ Export</button>
        <button id="btn-sync"   title="Write map to public/maps/latest_map.json">⬆ Sync</button>

        <div id="brush-display">
          <span class="vp-lbl">Brush</span>
          <div id="brush-swatch" aria-label="Active brush preview"></div>
          <span id="brush-label">— none —</span>
        </div>

      </div><!-- /viewport-toolbar -->

      <div id="canvas-wrap">
        <canvas id="map-canvas"></canvas>
      </div>

    </div><!-- /map-viewport -->

    <!-- ── Area 3: Tile Inspector (col 2 / row 1) ──────────────────────────── -->
    <aside id="tile-inspector" aria-label="Tile inspector">
      <div class="panel-hdr">
        <span>Tile Inspector</span>
        <span class="panel-hdr-right" id="inspector-coord">—</span>
      </div>
      <div id="inspector-scroll">
        <p id="inspector-empty">Click a tile to inspect its layers.</p>
        <div id="inspector-layers"></div>
      </div>
    </aside>

    <!-- ── Area 2: Asset Browser (col 1-2 / row 2) ─────────────────────────── -->
    <section id="asset-browser" aria-label="Asset browser">

      <!-- Left: Folder Rail -->
      <div id="folder-rail" aria-label="Folder navigator">
        <div id="rail-search-row">
          <input id="folder-search" type="search" placeholder="Search folders…"
                 autocomplete="off" aria-label="Search folders">
          <select id="tag-dropdown" aria-label="Filter by tag">
            <option value="">All Tags</option>
          </select>
          <span id="folder-count">—</span>
        </div>
        <div id="folder-list" role="list" aria-label="Folder list">
          <span style="color:var(--text-dim);font-size:12px;font-style:italic;padding:8px 12px;display:block">Loading…</span>
        </div>
      </div>

      <!-- Right: Sprite Content -->
      <div id="sprite-content" aria-label="Sprite content">
        <span style="color:var(--text-dim);font-size:12px;font-style:italic;padding:14px;display:block">
          Select a folder to browse its sprites.
        </span>
      </div>

    </section>

  </div><!-- /dashboard -->

</div><!-- /app -->

<script type="module" src="/src/dashboard.js"></script>
</body>
</html>
